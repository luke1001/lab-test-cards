<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280" role="img" aria-labelledby="title desc">
  <title id="title">Throat Culture lab test study card</title>
  <desc id="desc">A microbiology test that checks throat swabs for specific organism growth.</desc>
  <rect width="720" height="1280" rx="36" fill="#ffffff"/>
  <rect x="0" y="0" width="720" height="1280" rx="36" fill="#ea580c" opacity="0.045"/>
  <rect x="38" y="38" width="644" height="1204" rx="30" fill="#ffffff" stroke="#d8dee8" stroke-width="3"/>
  <rect x="38" y="38" width="644" height="122" rx="30" fill="#ea580c"/>
  <text x="58" y="104" font-size="48" font-weight="800" fill="#ffffff">Throat Culture</text>
  <text x="58" y="144" font-size="24" font-weight="500" fill="#eef6ff">Throat Culture</text>
  <rect x="508" y="72" width="142" height="42" rx="21" fill="#ffffff" opacity="0.22"/>
  <text x="532" y="101" font-size="21" font-weight="700" fill="#ffffff">Microbiology</text>
  <text x="58" y="210" font-size="26" font-weight="700" fill="#111827">Pronounced: throte kul-chur</text>
  <circle cx="92" cy="290" r="44" fill="#ea580c" opacity="0.14"/><text x="62" y="300" font-size="22" font-weight="700" fill="#ea580c">SWA</text><circle cx="238" cy="290" r="44" fill="#ea580c" opacity="0.14"/><text x="208" y="300" font-size="22" font-weight="700" fill="#ea580c">THR</text><circle cx="384" cy="290" r="44" fill="#ea580c" opacity="0.14"/><text x="354" y="300" font-size="22" font-weight="700" fill="#ea580c">PLA</text><circle cx="530" cy="290" r="44" fill="#ea580c" opacity="0.14"/><text x="500" y="300" font-size="22" font-weight="700" fill="#ea580c">STR</text>
  <text x="58" y="392" font-size="27" font-weight="800" fill="#ea580c">What it is</text>
  <text x="58" y="430" font-size="24" font-weight="500" fill="#374151">A microbiology test that checks throat swabs</text>
<text x="58" y="462" font-size="24" font-weight="500" fill="#374151">for specific organism growth.</text>
  <text x="58" y="488" font-size="27" font-weight="800" fill="#ea580c">Why it&#x27;s ordered</text>
  <circle cx="70" cy="512" r="6" fill="#ea580c"/>
<text x="92" y="520" font-size="24" font-weight="500" fill="#374151">Evaluate strep or throat infection</text>
<text x="92" y="550" font-size="24" font-weight="500" fill="#374151">concerns</text>
<circle cx="70" cy="580" r="6" fill="#ea580c"/>
<text x="92" y="588" font-size="24" font-weight="500" fill="#374151">Confirm rapid-test follow-up when ordered</text>
<circle cx="70" cy="618" r="6" fill="#ea580c"/>
<text x="92" y="626" font-size="24" font-weight="500" fill="#374151">Support organism identification</text>
<circle cx="70" cy="656" r="6" fill="#ea580c"/>
<text x="92" y="664" font-size="24" font-weight="500" fill="#374151">Common outpatient or ED test</text>
  <text x="58" y="766" font-size="27" font-weight="800" fill="#ea580c">Common specimen</text>
  <text x="58" y="805" font-size="24" font-weight="500" fill="#374151">Throat swab; common tube/container: Culture</text>
<text x="58" y="837" font-size="24" font-weight="500" fill="#374151">swab transport</text>
  <text x="58" y="868" font-size="27" font-weight="800" fill="#ea580c">Lab helper cue</text>
  <circle cx="70" cy="892" r="6" fill="#ea580c"/>
<text x="92" y="900" font-size="24" font-weight="500" fill="#374151">Use correct swab transport</text>
<circle cx="70" cy="930" r="6" fill="#ea580c"/>
<text x="92" y="938" font-size="24" font-weight="500" fill="#374151">Label source clearly</text>
<circle cx="70" cy="968" r="6" fill="#ea580c"/>
<text x="92" y="976" font-size="24" font-weight="500" fill="#374151">Route to microbiology</text>
  <rect x="58" y="1050" width="604" height="96" rx="22" fill="#ea580c" opacity="0.10"/>
  <text x="82" y="1084" font-size="24" font-weight="800" fill="#ea580c">Memory hook</text>
  <text x="58" y="1098" font-size="25" font-weight="500" fill="#111827">Throat culture grows the answer from the swab.</text>
  <text x="58" y="1204" font-size="20" font-weight="500" fill="#64748b">Quick study card - follow your site&#x27;s specimen policy and tube guide.</text>
</svg>
