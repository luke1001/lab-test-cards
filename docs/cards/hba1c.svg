<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280" role="img" aria-labelledby="title desc">
  <title id="title">HbA1c lab test study card</title>
  <desc id="desc">A test reflecting longer-term glucose exposure through hemoglobin glycation.</desc>
  <rect width="720" height="1280" rx="36" fill="#ffffff"/>
  <rect x="0" y="0" width="720" height="1280" rx="36" fill="#059669" opacity="0.045"/>
  <rect x="38" y="38" width="644" height="1204" rx="30" fill="#ffffff" stroke="#d8dee8" stroke-width="3"/>
  <rect x="38" y="38" width="644" height="122" rx="30" fill="#059669"/>
  <text x="58" y="104" font-size="48" font-weight="800" fill="#ffffff">HbA1c</text>
  <text x="58" y="144" font-size="24" font-weight="500" fill="#eef6ff">Hemoglobin A1c</text>
  <rect x="508" y="72" width="142" height="42" rx="21" fill="#ffffff" opacity="0.22"/>
  <text x="532" y="101" font-size="21" font-weight="700" fill="#ffffff">Chemistry</text>
  <text x="58" y="210" font-size="26" font-weight="700" fill="#111827">Pronounced: hee-moh-gloh-bin ay-one-see</text>
  <circle cx="92" cy="290" r="44" fill="#059669" opacity="0.14"/><text x="62" y="300" font-size="22" font-weight="700" fill="#059669">A1C</text><circle cx="238" cy="290" r="44" fill="#059669" opacity="0.14"/><text x="208" y="300" font-size="22" font-weight="700" fill="#059669">SUG</text><circle cx="384" cy="290" r="44" fill="#059669" opacity="0.14"/><text x="354" y="300" font-size="22" font-weight="700" fill="#059669">RBC</text><circle cx="530" cy="290" r="44" fill="#059669" opacity="0.14"/><text x="500" y="300" font-size="22" font-weight="700" fill="#059669">TRE</text>
  <text x="58" y="392" font-size="27" font-weight="800" fill="#059669">What it is</text>
  <text x="58" y="430" font-size="24" font-weight="500" fill="#374151">A test reflecting longer-term glucose exposure</text>
<text x="58" y="462" font-size="24" font-weight="500" fill="#374151">through hemoglobin glycation.</text>
  <text x="58" y="488" font-size="27" font-weight="800" fill="#059669">Why it&#x27;s ordered</text>
  <circle cx="70" cy="512" r="6" fill="#059669"/>
<text x="92" y="520" font-size="24" font-weight="500" fill="#374151">Monitor diabetes care</text>
<circle cx="70" cy="550" r="6" fill="#059669"/>
<text x="92" y="558" font-size="24" font-weight="500" fill="#374151">Screen glucose control patterns</text>
<circle cx="70" cy="588" r="6" fill="#059669"/>
<text x="92" y="596" font-size="24" font-weight="500" fill="#374151">Useful because it is not a single moment</text>
<text x="92" y="626" font-size="24" font-weight="500" fill="#374151">glucose</text>
<circle cx="70" cy="656" r="6" fill="#059669"/>
<text x="92" y="664" font-size="24" font-weight="500" fill="#374151">Often ordered with metabolic labs</text>
  <text x="58" y="766" font-size="27" font-weight="800" fill="#059669">Common specimen</text>
  <text x="58" y="805" font-size="24" font-weight="500" fill="#374151">Whole blood; common tube/container: Lavender</text>
<text x="58" y="837" font-size="24" font-weight="500" fill="#374151">EDTA tube</text>
  <text x="58" y="868" font-size="27" font-weight="800" fill="#059669">Lab helper cue</text>
  <circle cx="70" cy="892" r="6" fill="#059669"/>
<text x="92" y="900" font-size="24" font-weight="500" fill="#374151">Route per local analyzer area</text>
<circle cx="70" cy="930" r="6" fill="#059669"/>
<text x="92" y="938" font-size="24" font-weight="500" fill="#374151">Mix EDTA tube gently</text>
<circle cx="70" cy="968" r="6" fill="#059669"/>
<text x="92" y="976" font-size="24" font-weight="500" fill="#374151">Usually not handled like serum chemistry</text>
  <rect x="58" y="1050" width="604" height="96" rx="22" fill="#059669" opacity="0.10"/>
  <text x="82" y="1084" font-size="24" font-weight="800" fill="#059669">Memory hook</text>
  <text x="58" y="1098" font-size="25" font-weight="500" fill="#111827">A1c is sugar history attached to hemoglobin.</text>
  <text x="58" y="1204" font-size="20" font-weight="500" fill="#64748b">Quick study card - follow your site&#x27;s specimen policy and tube guide.</text>
</svg>
