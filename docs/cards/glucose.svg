<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280" role="img" aria-labelledby="title desc">
  <title id="title">Glucose lab test study card</title>
  <desc id="desc">A chemistry test measuring blood sugar at the collection time.</desc>
  <rect width="720" height="1280" rx="36" fill="#ffffff"/>
  <rect x="0" y="0" width="720" height="1280" rx="36" fill="#059669" opacity="0.045"/>
  <rect x="38" y="38" width="644" height="1204" rx="30" fill="#ffffff" stroke="#d8dee8" stroke-width="3"/>
  <rect x="38" y="38" width="644" height="122" rx="30" fill="#059669"/>
  <text x="58" y="104" font-size="48" font-weight="800" fill="#ffffff">Glucose</text>
  <text x="58" y="144" font-size="24" font-weight="500" fill="#eef6ff">Blood Glucose</text>
  <rect x="508" y="72" width="142" height="42" rx="21" fill="#ffffff" opacity="0.22"/>
  <text x="532" y="101" font-size="21" font-weight="700" fill="#ffffff">Chemistry</text>
  <text x="58" y="210" font-size="26" font-weight="700" fill="#111827">Pronounced: gloo-kose</text>
  <circle cx="92" cy="290" r="44" fill="#059669" opacity="0.14"/><text x="62" y="300" font-size="22" font-weight="700" fill="#059669">SUG</text><circle cx="238" cy="290" r="44" fill="#059669" opacity="0.14"/><text x="208" y="300" font-size="22" font-weight="700" fill="#059669">DRO</text><circle cx="384" cy="290" r="44" fill="#059669" opacity="0.14"/><text x="354" y="300" font-size="22" font-weight="700" fill="#059669">CHE</text><circle cx="530" cy="290" r="44" fill="#059669" opacity="0.14"/><text x="500" y="300" font-size="22" font-weight="700" fill="#059669">TUB</text>
  <text x="58" y="392" font-size="27" font-weight="800" fill="#059669">What it is</text>
  <text x="58" y="430" font-size="24" font-weight="500" fill="#374151">A chemistry test measuring blood sugar at the</text>
<text x="58" y="462" font-size="24" font-weight="500" fill="#374151">collection time.</text>
  <text x="58" y="488" font-size="27" font-weight="800" fill="#059669">Why it&#x27;s ordered</text>
  <circle cx="70" cy="512" r="6" fill="#059669"/>
<text x="92" y="520" font-size="24" font-weight="500" fill="#374151">Screen high or low glucose</text>
<circle cx="70" cy="550" r="6" fill="#059669"/>
<text x="92" y="558" font-size="24" font-weight="500" fill="#374151">Monitor diabetes care</text>
<circle cx="70" cy="588" r="6" fill="#059669"/>
<text x="92" y="596" font-size="24" font-weight="500" fill="#374151">Evaluate metabolic symptoms</text>
<circle cx="70" cy="626" r="6" fill="#059669"/>
<text x="92" y="634" font-size="24" font-weight="500" fill="#374151">Common emergency test</text>
  <text x="58" y="766" font-size="27" font-weight="800" fill="#059669">Common specimen</text>
  <text x="58" y="805" font-size="24" font-weight="500" fill="#374151">Serum or plasma; common tube/container: Gray,</text>
<text x="58" y="837" font-size="24" font-weight="500" fill="#374151">gold/SST, or green tube depending on site</text>
  <text x="58" y="868" font-size="27" font-weight="800" fill="#059669">Lab helper cue</text>
  <circle cx="70" cy="892" r="6" fill="#059669"/>
<text x="92" y="900" font-size="24" font-weight="500" fill="#374151">Tube choice varies by workflow</text>
<circle cx="70" cy="930" r="6" fill="#059669"/>
<text x="92" y="938" font-size="24" font-weight="500" fill="#374151">Process promptly when required</text>
<circle cx="70" cy="968" r="6" fill="#059669"/>
<text x="92" y="976" font-size="24" font-weight="500" fill="#374151">Route to chemistry or point-of-care area</text>
  <rect x="58" y="1050" width="604" height="96" rx="22" fill="#059669" opacity="0.10"/>
  <text x="82" y="1084" font-size="24" font-weight="800" fill="#059669">Memory hook</text>
  <text x="58" y="1098" font-size="25" font-weight="500" fill="#111827">Glucose is the current sugar snapshot.</text>
  <text x="58" y="1204" font-size="20" font-weight="500" fill="#64748b">Quick study card - follow your site&#x27;s specimen policy and tube guide.</text>
</svg>
